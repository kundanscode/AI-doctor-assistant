spring:
  application:
    name: prescription-analyzer

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

google:
  cloud:
    vision:
      credentials-path: classpath:google-vision-credentials.json

server:
  port: 8080

spring:
  application:
    name: prescription-analyzer

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

google:
  cloud:
    vision:
      credentials-path: classpath:google-vision-credentials.json

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile

server:
  port: 8080
